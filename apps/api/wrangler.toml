# Cloudflare Workers config for the dictionary API.
# Production deploy/publish is performed manually by a human operator.
# Non-production preview deploys (this route) are CTO-autonomous per
# CLAUDE.md §8.6 / global CLAUDE.md §27.1 — see docs/DEPLOYMENT.md.
name = "obcda-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Secrets (never in this file): DATABASE_URL, LLM_API_KEY → `wrangler secret put`
[vars]
# CORS allowlist for the web origin. This file only feeds `wrangler deploy`
# (the human-operated production path), so it carries the production web
# origin; the Pages full-stack preview is same-origin and never reads it
# (docs/DEPLOYMENT.md §3.4).
ALLOWED_ORIGIN = "https://obcda-web.pages.dev"
# Production must not silently fall back to fixtures when DATABASE_URL is
# missing — flip to "true" once the Neon main branch is provisioned (§3.3).
REQUIRE_DATABASE = "false"

[observability]
enabled = true

# Non-production preview custom domain (zone: mirai-dx-platform.com).
[[routes]]
pattern = "obcda-api.mirai-dx-platform.com"
custom_domain = true
